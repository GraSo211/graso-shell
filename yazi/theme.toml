# Matugen template: yazi file manager theme from wallpaper

[mode]
normal_main = { fg = "#343025", bg = "#ded7c6", bold = true }
normal_alt  = { fg = "#ded7c6", bg = "reset" }
select_main = { fg = "#32302b", bg = "#cbc6be", bold = true }
select_alt  = { fg = "#cbc6be", bg = "reset" }
unset_main  = { fg = "#322f37", bg = "#dbd6e0", bold = true }
unset_alt   = { fg = "#dbd6e0", bg = "reset" }

[status]
overall = { fg = "reset", bg = "reset" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_type  = { fg = "#ded7c6", bold = true }
perm_read  = { fg = "#dbd6e0" }
perm_write = { fg = "#cbc6be" }
perm_exec  = { fg = "#ffb4ab" }
perm_sep   = { fg = "#959086" }

progress_label  = { fg = "#e6e2df", bold = true }
progress_normal = { fg = "#ded7c6", bg = "reset" }
progress_error  = { fg = "#ffb4ab", bg = "reset" }

[mgr]
cwd = { fg = "#ded7c6", bold = true }

find_keyword  = { fg = "#dbd6e0", bold = true, italic = true, underline = true }
find_position = { fg = "#cbc6be", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#ded7c6", bg = "#ded7c6" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#cbc6be", bg = "#cbc6be" }
marker_selected = { fg = "#dbd6e0", bg = "#dbd6e0" }

count_copied   = { fg = "#343025", bg = "#ded7c6" }
count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#322f37", bg = "#dbd6e0" }

border_symbol = "│"
border_style  = { fg = "#959086" }

hovered = { bg = "#3a3937" }

[indicator]
parent  = { fg = "#cbc6be", bold = true }
current = { fg = "#ded7c6", bold = true }
preview = { fg = "#959086", bold = true }
padding = { open = "", close = " " }

[tabs]
active   = { fg = "#343025", bg = "#ded7c6" }
inactive = { fg = "#e6e2df", bg = "#201f1e" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[input]
border   = { fg = "#ded7c6" }
title    = { fg = "#ded7c6" }
value    = { fg = "#e6e2df" }
selected = { reversed = true }

[pick]
border   = { fg = "#ded7c6" }
active   = { fg = "#343025", bg = "#ded7c6" }
inactive = { fg = "#e6e2df" }

[confirm]
border = { fg = "#ded7c6" }
title  = { fg = "#ded7c6" }
body   = { fg = "#e6e2df" }
list   = { fg = "#e6e2df" }
btn_yes = { fg = "#343025", bg = "#ded7c6" }
btn_no  = { fg = "#690005", bg = "#ffb4ab" }
btn_labels = [ " Yes ", " No " ]

[notify]
title_info  = { fg = "#ded7c6" }
title_warn  = { fg = "#dbd6e0" }
title_error = { fg = "#ffb4ab" }

[help]
on     = { fg = "#ded7c6" }
run    = { fg = "#cbc6be" }
desc   = { fg = "#e6e2df" }
hovered = { reversed = true }
footer  = { fg = "#959086" }

[which]
cols = 3
mask = { bg = "#201f1e" }
cand = { fg = "#ded7c6" }
rest = { fg = "#959086" }
desc = { fg = "#e6e2df" }
separator = " → "
separator_style = { fg = "#959086" }

[tasks]
border  = { fg = "#ded7c6" }
title   = { fg = "#ded7c6" }
hovered = { reversed = true }

[filetype]
rules = [
    { mime = "image/*", fg = "#cbc6be" },
    { mime = "{audio,video}/*", fg = "#cbc6be" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },
    { mime = "application/{pdf,doc,rtf}", fg = "#ded7c6" },
    { url = "*/", fg = "#cbc6be", bold = true },
    { url = "*", fg = "#dbd6e0" },
]

[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []
