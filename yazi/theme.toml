# Matugen template: yazi file manager theme from wallpaper

[mode]
normal_main = { fg = "#00363e", bg = "#7dd3e4", bold = true }
normal_alt  = { fg = "#7dd3e4", bg = "reset" }
select_main = { fg = "#15353a", bg = "#acccd3", bold = true }
select_alt  = { fg = "#acccd3", bg = "reset" }
unset_main  = { fg = "#4c2700", bg = "#ffb77a", bold = true }
unset_alt   = { fg = "#ffb77a", bg = "reset" }

[status]
overall = { fg = "reset", bg = "reset" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_type  = { fg = "#7dd3e4", bold = true }
perm_read  = { fg = "#ffb77a" }
perm_write = { fg = "#acccd3" }
perm_exec  = { fg = "#ffb4ab" }
perm_sep   = { fg = "#889395" }

progress_label  = { fg = "#e0e3e4", bold = true }
progress_normal = { fg = "#7dd3e4", bg = "reset" }
progress_error  = { fg = "#ffb4ab", bg = "reset" }

[mgr]
cwd = { fg = "#7dd3e4", bold = true }

find_keyword  = { fg = "#ffb77a", bold = true, italic = true, underline = true }
find_position = { fg = "#acccd3", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#7dd3e4", bg = "#7dd3e4" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#acccd3", bg = "#acccd3" }
marker_selected = { fg = "#ffb77a", bg = "#ffb77a" }

count_copied   = { fg = "#00363e", bg = "#7dd3e4" }
count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#4c2700", bg = "#ffb77a" }

border_symbol = "│"
border_style  = { fg = "#889395" }

hovered = { bg = "#363a3b" }

[indicator]
parent  = { fg = "#acccd3", bold = true }
current = { fg = "#7dd3e4", bold = true }
preview = { fg = "#889395", bold = true }
padding = { open = "", close = " " }

[tabs]
active   = { fg = "#00363e", bg = "#7dd3e4" }
inactive = { fg = "#e0e3e4", bg = "#1c2021" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[input]
border   = { fg = "#7dd3e4" }
title    = { fg = "#7dd3e4" }
value    = { fg = "#e0e3e4" }
selected = { reversed = true }

[pick]
border   = { fg = "#7dd3e4" }
active   = { fg = "#00363e", bg = "#7dd3e4" }
inactive = { fg = "#e0e3e4" }

[confirm]
border = { fg = "#7dd3e4" }
title  = { fg = "#7dd3e4" }
body   = { fg = "#e0e3e4" }
list   = { fg = "#e0e3e4" }
btn_yes = { fg = "#00363e", bg = "#7dd3e4" }
btn_no  = { fg = "#690005", bg = "#ffb4ab" }
btn_labels = [ " Yes ", " No " ]

[notify]
title_info  = { fg = "#7dd3e4" }
title_warn  = { fg = "#ffb77a" }
title_error = { fg = "#ffb4ab" }

[help]
on     = { fg = "#7dd3e4" }
run    = { fg = "#acccd3" }
desc   = { fg = "#e0e3e4" }
hovered = { reversed = true }
footer  = { fg = "#889395" }

[which]
cols = 3
mask = { bg = "#1c2021" }
cand = { fg = "#7dd3e4" }
rest = { fg = "#889395" }
desc = { fg = "#e0e3e4" }
separator = " → "
separator_style = { fg = "#889395" }

[tasks]
border  = { fg = "#7dd3e4" }
title   = { fg = "#7dd3e4" }
hovered = { reversed = true }

[filetype]
rules = [
    { mime = "image/*", fg = "#acccd3" },
    { mime = "{audio,video}/*", fg = "#acccd3" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },
    { mime = "application/{pdf,doc,rtf}", fg = "#7dd3e4" },
    { url = "*/", fg = "#acccd3", bold = true },
    { url = "*", fg = "#ffb77a" },
]

[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []
